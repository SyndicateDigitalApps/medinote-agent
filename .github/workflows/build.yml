name: Build MediNote Agent

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build:win -- --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediNoteAgent-Windows
          path: dist/*.exe
          retention-days: 30

      - name: Create Release (doar pe tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          name: MediNote Agent ${{ github.ref_name }}
          body: |
            ## MediNote Agent ${{ github.ref_name }}

            ### Instalare
            1. Descarcă `MediNote-Agent-Setup-*.exe`
            2. Rulează installerul (poate cere confirmare UAC)
            3. Agentul pornește automat și apare în tray (colțul dreapta-jos)

            ### Cerințe
            - Windows 10 / 11 (64-bit)
            - Cititor card sănătate conectat via USB
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
